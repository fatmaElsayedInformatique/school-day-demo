<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#EFEEE9">
<title>منصة المدرسة · البروتوتايب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap">
<style>
/* Layout: demo bar on top · RTL sidebar (role + screens) · live web workspace · docked phone that reacts in real time */
/* Layout: approved theme (v1.3) — warm grey shell around a light glass product; dark rail sidebar; docked phone that reacts live */
:root{
  /* shell (the frame around the product) */
  --shell-bg:#E6E5E0; --shell-ink:#141414; --shell-muted:#6B6962; --shell-line:#D7D5CE;
  /* product (always light, like the approved prototype) */
  --ground:#EFEEE9;
  --app-bg-img:radial-gradient(620px 420px at 88% -6%,rgba(242,176,138,.38),transparent 70%),radial-gradient(620px 440px at 12% 108%,rgba(222,208,190,.55),transparent 70%);
  --bg:#EFEEE9; --surface:rgba(255,255,255,.66); --surface-solid:#FFFFFF; --surface-2:rgba(255,255,255,.5); --sunk:rgba(20,20,20,.06);
  --glass-line:rgba(255,255,255,.85); --blur:blur(20px) saturate(150%);
  --ink:#141414; --ink-2:#55534D; --muted:#8C8A83; --line:rgba(20,20,20,.08); --line-2:rgba(20,20,20,.12);
  --brand:#2F6B58; --brand-2:#1F3B34; --brand-soft:#E3EEE7; --brand-ink:#1F3B34;
  --hot:#E8764A; --hot-soft:#FBE7DC; --hot-ink:#8A3B1C; --hot-glass:rgba(232,118,74,.16); --hot-line:rgba(232,118,74,.35);
  --ok:#2E6B4F; --ok-soft:#E3EEE7; --warn:#7A5510; --warn-soft:#F6EACB; --bad:#8A3B1C; --bad-soft:#FBE7DC;
  --wa:#1FA855; --wa-bg:#E9E2D7; --wa-bubble:#FFFFFF; --wa-head:#0B6E5F;
  --coach:#141414; --coach-ink:#ECEBE6; --coach-muted:#A09E97;
  --phone:#141414; --app-bg:#EFEEE9;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px rgba(60,40,20,.05);
  --shadow-lg:0 20px 50px rgba(60,40,20,.14);
  --f:"Almarai",system-ui,"Segoe UI",Tahoma,sans-serif;
  --fd:"Almarai",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:20px; --r-sm:12px; --on-brand:#FFFFFF; --hb:100%;
  color-scheme:light;
}
/* dark mode only changes the shell, the product stays light (same as v1.3) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shell-bg:#121211;--shell-ink:#ECEBE6;--shell-muted:#A09E97;--shell-line:#2E2D2A}}
:root[data-theme="dark"]{--shell-bg:#121211;--shell-ink:#ECEBE6;--shell-muted:#A09E97;--shell-line:#2E2D2A}
/* per-school identity */
body[data-school="nat"]{--brand:#8A2A41;--brand-2:#5E1A2B;--brand-soft:#F6E8EC;--brand-ink:#5E1A2B}
.screen[data-s="waha"]{--brand:#3B4FA8;--brand-2:#26357A;--brand-soft:#E6E9F7;--brand-ink:#26357A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--shell-bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;direction:rtl;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.3;text-wrap:balance;font-weight:800}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- demo bar ---------- */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--shell-bg);color:var(--shell-ink);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.demo .logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:15px}
.demo .logo .mark{width:32px;height:32px;border-radius:10px;background:var(--hot);display:grid;place-items:center;color:#141414;font-weight:800;font-size:13px}
.demo .logo small{color:var(--shell-muted);font-weight:400;font-family:var(--f);font-size:12px}
.demo .sp{flex:1}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--shell-line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:12.5px;color:var(--shell-muted);white-space:nowrap}
.seg button.on{background:var(--shell-ink);color:var(--shell-bg);font-weight:700}
.clock{font-family:var(--fd);font-size:12.5px;color:var(--shell-muted);display:flex;gap:6px;align-items:center}
.clock b{color:var(--shell-ink);font-weight:700}
.btn-tour{background:var(--hot);color:#141414;padding:9px 16px;border-radius:999px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:13px}
.btn-tour:hover{filter:brightness(1.05)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 66px);margin:0 14px 14px;border-radius:26px;background:var(--app-bg-img),var(--ground);overflow:clip;gap:0;padding:14px 0 0 0}
.side{background:rgba(20,20,20,.88);color:#fff;border-radius:20px;margin:0 14px 14px 0;padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:80px;height:calc(100vh - 108px);overflow:auto;scrollbar-width:none}
.school-id{display:flex;gap:10px;align-items:center;padding:6px 6px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.crest{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:16px;flex:none}
.school-id b{font-family:var(--fd);font-weight:600;font-size:14px;display:block}
.school-id small{color:#A9A7A0;font-size:11.5px}
.role-pick{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:11px;color:#A9A7A0;letter-spacing:.4px;padding:0 6px}
.role-pick select{width:100%;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;color-scheme:dark}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:#A9A7A0;text-align:right;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:rgba(255,255,255,.95);color:var(--ink);font-weight:700}
.nav .badge{margin-inline-start:auto;background:var(--hot);color:#fff;border-radius:20px;font-size:11px;padding:0 7px;line-height:18px}
.nav .new{margin-inline-start:auto;font-size:10px;color:#F2B08A;background:rgba(232,118,74,.18);border-radius:20px;padding:0 6px;line-height:17px}
.side .foot{margin-top:auto;font-size:10.5px;color:#8C8A83;padding:8px 6px;border-top:1px solid rgba(255,255,255,.1)}

.main{min-width:0;padding:6px 10px 120px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:24px;letter-spacing:-.2px}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.page-h .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--glass-line);border-radius:var(--r);padding:16px 18px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.card h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h .r{margin-inline-start:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-family:var(--fd);font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.4px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
.kpi .d{font-size:12px}
.up{color:var(--ok)} .down{color:var(--bad)}
.b{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;font-weight:400;font-size:13px;border:1px solid var(--glass-line);background:rgba(255,255,255,.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);white-space:nowrap}
.b:hover{background:#fff}
.b.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.b.pri:hover{background:#2A2926}
.b.hot{background:var(--hot);border-color:var(--hot);color:#141414}
.b.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.b.sm{padding:5px 11px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(20,20,20,.08);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--hot-soft);color:var(--hot-ink);border-color:var(--hot-line)} .chip.hot{background:var(--hot-soft);color:var(--hot-ink);border-color:var(--hot-line)}
.chip.br{background:var(--brand-soft);color:var(--brand-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t{min-width:540px}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--surface-2)}
.t td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none;font-family:var(--fd)}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:600;display:block;font-size:13px;white-space:nowrap}
.who small{color:var(--muted);font-size:11.5px}
.bar{height:8px;background:var(--sunk);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:8px;transition:width .6s}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line);margin:12px 0}
.tabs{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:999px;margin-bottom:14px;overflow-x:auto;width:max-content;max-width:100%}
.tabs button{padding:7px 14px;font-size:13px;color:var(--ink-2);border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{padding:10px 14px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.85)}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* morning brief */
.brief{background:var(--surface);border:1px solid var(--glass-line);border-radius:var(--r);padding:16px 18px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.brief h3 svg.i{width:26px;height:26px;padding:5px;border-radius:8px;background:var(--hot-glass);color:var(--hot-ink)}
.brief h3{font-size:15px}
.brief ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.brief li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.6);border:1px solid var(--glass-line);border-radius:16px;padding:10px 12px}
.brief li .sev{width:4px;align-self:stretch;border-radius:4px;background:var(--hot);flex:none}
.brief li .sev.w{background:var(--warn)} .brief li .sev.i{background:var(--brand)}
.brief li .tx{flex:1;min-width:0}
.brief li .tx b{display:block;font-size:13.5px}
.brief li .tx small{color:var(--muted);font-size:12px}

/* timetable */
.tt{display:grid;grid-template-columns:70px repeat(5,minmax(130px,1fr));gap:6px;min-width:760px}
.tt .h{font-size:12px;color:var(--muted);padding:4px;text-align:center}
.tt .p{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;align-items:center}
.slot{background:rgba(255,255,255,.6);border:1px solid var(--glass-line);border-radius:12px;padding:7px 8px;font-size:12px;min-height:54px}
.slot b{display:block;font-size:12.5px}
.slot small{color:var(--muted)}
.slot.split{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--brand-soft);border-color:transparent}
.slot.split div{background:var(--surface);border-radius:7px;padding:4px 6px;font-size:11.5px;min-width:0}
.slot.split .sl{grid-column:1/-1;font-size:10.5px;color:var(--brand-ink);font-weight:600;padding:0 2px}
.slot.split small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.brk{background:transparent;border-style:dashed;display:grid;place-items:center;color:var(--muted)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;min-width:1150px}
.kcol{background:rgba(255,255,255,.4);border:1px solid var(--glass-line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.kcol h4{font-size:13px;display:flex;align-items:center;gap:6px}
.kcol h4 span{margin-inline-start:auto;color:var(--muted);font-family:var(--f);font-weight:400}
.kcard{background:rgba(255,255,255,.82);border:1px solid var(--glass-line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.kcard b{font-size:13px}
.kcard .meta{display:flex;flex-wrap:wrap;gap:4px}

/* bus map */
.map{position:relative;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.55);border:1px solid var(--glass-line)}
.map svg{display:block;width:100%;height:auto}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,17,.35);z-index:60;display:flex;justify-content:flex-start}
.drawer{width:min(620px,100%);height:100%;background:var(--ground);overflow:auto;box-shadow:var(--shadow-lg);animation:slideIn .25s ease-out}
@keyframes slideIn{from{transform:translateX(-30px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;position:sticky;top:0;background:var(--ground);z-index:1}
.drawer-b{padding:16px 20px 40px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.nid{display:flex;gap:3px;direction:ltr;justify-content:flex-end;font-family:var(--fd)}
.nid span{padding:3px 4px;border-radius:5px;background:var(--sunk);font-size:13px}
.nid span.c{background:var(--brand-soft);color:var(--brand-ink)}
.nid span.g{background:var(--hot-soft);color:var(--hot-ink)}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--warn);background:var(--warn-soft);padding:1px 7px;border-radius:20px}

/* toasts */
.toasts{position:fixed;bottom:22px;right:260px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;display:flex;gap:8px;align-items:center;animation:pop .3s ease-out;max-width:380px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* pulse highlight for tour */
.spot{position:relative;z-index:2;box-shadow:0 0 0 3px var(--hot),0 0 0 9px color-mix(in srgb,var(--hot) 25%,transparent)!important;border-radius:14px;transition:box-shadow .3s}
@media (prefers-reduced-motion:no-preference){.spot{animation:ring 1.6s ease-in-out infinite}}
@keyframes ring{50%{box-shadow:0 0 0 3px var(--hot),0 0 0 14px color-mix(in srgb,var(--hot) 8%,transparent)}}

/* coach (tour) */
.coach{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;width:min(560px,calc(100% - 32px));background:var(--coach);color:var(--coach-ink);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:8px;animation:pop .3s}
.coach .top{display:flex;align-items:center;gap:10px}
.coach .step{font-family:var(--fd);font-size:12px;color:var(--hot);font-weight:800}
.coach .time{font-size:12px;color:var(--coach-muted)}
.coach h4{font-size:16px;color:#fff}
.coach p{margin:0;font-size:13px;color:#C9D6D1}
.coach .why{font-size:12.5px;color:#F2C2A9;display:flex;gap:6px}
.coach .ctr{display:flex;align-items:center;gap:8px;margin-top:4px}
.coach .dots{display:flex;gap:4px;flex:1}
.coach .dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
.coach .dots i.on{background:var(--hot);width:18px}
.coach .cb{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px}
.coach .cb.n{background:var(--hot);color:#141414;font-weight:700}
.coach .x{margin-inline-start:auto;color:var(--coach-muted);font-size:12px}

/* ---------- phone ---------- */
.dock{background:transparent;padding:4px 14px 16px;position:sticky;top:80px;height:calc(100vh - 94px);display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto}
.dock .seg{background:rgba(255,255,255,.5);border-color:var(--glass-line)}
.dock .seg button{color:var(--ink-2)}
.dock .seg button.on{background:var(--ink);color:#fff}
.dock .hint{font-size:11.5px;color:var(--muted);text-align:center;max-width:320px}
.phone{width:350px;height:720px;flex:none;border-radius:50px;background:var(--phone);padding:10px;box-shadow:var(--shadow-lg);position:relative}
.screen{width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--app-bg-img),var(--ground);position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#000;border-radius:20px;z-index:20}
.sbar{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:var(--fd);font-size:13px;font-weight:600;direction:ltr;color:var(--ink)}
.sbar .ic{display:flex;gap:5px;align-items:center}
.app{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.app-h{padding:6px 18px 10px;display:flex;align-items:center;gap:10px}
.app-h .crest{width:34px;height:34px;border-radius:10px;font-size:14px}
.app-h .t b{font-family:var(--fd);font-size:15px;display:block;line-height:1.2}
.app-h .t small{font-size:11px;color:var(--muted)}
.app-h .bell{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.75);border:1px solid var(--glass-line);display:grid;place-items:center;position:relative}
.app-h .bell i{position:absolute;top:6px;right:8px;width:8px;height:8px;background:var(--hot);border-radius:50%;border:2px solid var(--surface)}
.kids{display:flex;gap:8px;padding:0 18px 12px}
.kid{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--glass-line);font-size:12.5px}
.kid.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kid .av{width:24px;height:24px;font-size:10.5px}
.ac{background:var(--surface);border:1px solid var(--glass-line);border-radius:20px;margin:0 12px 10px;padding:13px 15px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}

.li .tx{flex:1;min-width:0} .li .tx b{display:block;font-weight:600;font-size:12.5px} .li .tx small{color:var(--muted);font-size:11px}

/* whatsapp */
.wa-h{background:var(--wa-head);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px}

.rc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}

function lineChart(sc){
 const W_=560,H=180,p={l:40,r:84,t:12,b:26},cols=['#1F8F7A','#5468C8','#8A64C0','#C9772E'];
 const data=[[93.1,93.6,94.0,94.2],[91.8,92.4,92.1,92.6],[94.6,94.9,95.3,95.1],[92.4,91.6,91.1,90.8]];
 const y0=89,y1=96,x=i=>p.l+i*(W_-p.l-p.r)/3,y=v=>p.t+(y1-v)/(y1-y0)*(H-p.t-p.b);
 let g='';[90,92,94,96].forEach(v=>{g+=`<line x1="${p.l}" x2="${W_-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p.l-6}" y="${y(v)+4}" font-size="14" fill="var(--muted)" text-anchor="end">${v}</text>`});
 ['أسبوع 1','أسبوع 2','أسبوع 3','الأسبوع ده'].forEach((t,i)=>g+=`<text x="${x(i)}" y="${H-6}" font-size="14" fill="var(--muted)" text-anchor="middle">${t}</text>`);
 data.forEach((d,k)=>{g+=`<polyline fill="none" stroke="${cols[k]}" stroke-width="2.4" points="${d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;g+=`<circle cx="${x(3)}" cy="${y(d[3])}" r="4" fill="${cols[k]}"/><text x="${x(3)+9}" y="${y(d[3])+4+[0,0,-4,4][k]}" font-size="15" fill="var(--ink-2)" text-anchor="start">${sc[k].short}</text>`});
 return `<svg viewBox="0 0 ${W_} ${H}" style="width:100%;height:auto;direction:ltr">${g}</svg>`;
}

function tourGo(i,back){
 const prev=TOUR[S.tour];
 if(prev&&!back&&i>S.tour){prev.auto&&prev.auto();prev.after&&prev.after()}
 S.tour=i; if(i<0||i>=TOUR.length){S.tour=-1;render();toast('خلصت الجولة · جربي أي حاجة بنفسك');return}
 const st=TOUR[i]; st.set&&st.set(); S.view=st.view||'web'; S.jump=null; if(st.time) S.clock=st.time;
 render();
}

 else if(d.trip!==undefined){S.trip=d.trip||null;if(d.trip){toast('ردّك وصل · المدرسة شايفة العدد مباشر');S.jump={msg:'شوف الرد في شاشة الإعلانات عند المدير',to:'web',role:'principal',screen:'ann'}}}
 navy?vt(render):render();

document.addEventListener('change',e=>{
 if(e.target.id==='rolePick'){const [v,k]=e.target.value.split(':');S.jump=null;S.drawer=null;if(v==='w'){S.view='web';S.role=k;S.screen=ROLES_()[k].screens[0]}else{S.view='app';S.phoneRole=k;S.wa=false;S.pSub=null;S.tSub=null;S.hSub=null;S.pTab='home'}vt(render)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='brColor'){S.brandDraft={name:(document.getElementById('brName')||{}).value||'',color:e.target.value};render()}
 if(e.target.id==='brLogo'&&e.target.files&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),m=160,k=Math.min(1,m/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);BR.logo=c.toDataURL('image/png');if(BR.on)saveBrand();render()};img.src=r.result};r.readAsDataURL(f)}
});
document.addEventListener('input',e=>{
