<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أسبوع الطالب · يوم في المدرسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap">
<style>
:root{
  --shell:#E6E5E0; --shell-ink:#141414; --shell-muted:#6B6962; --shell-line:#D7D5CE;
  --ground:#EFEEE9; --surface:rgba(255,255,255,.72); --solid:#fff; --sunk:rgba(20,20,20,.06);
  --ink:#141414; --ink-2:#55534D; --muted:#8C8A83; --line:rgba(20,20,20,.08);
  --brand:#8A2A41; --brand-2:#5E1A2B; --brand-soft:#F6E8EC;
  --hot:#E8764A; --hot-soft:#FBE7DC; --hot-ink:#8A3B1C;
  --ok:#2E6B4F; --ok-soft:#E3EEE7; --warn:#7A5510; --warn-soft:#F6EACB;
  --f:"Almarai",system-ui,"Segoe UI",Tahoma,sans-serif;
  --glow:radial-gradient(620px 420px at 88% -6%,rgba(242,176,138,.38),transparent 70%),radial-gradient(620px 440px at 12% 108%,rgba(222,208,190,.55),transparent 70%);
  color-scheme:light;
}
body[data-type="intl"]{--brand:#2F6B58;--brand-2:#1F3B34;--brand-soft:#E3EEE7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shell:#121211;--shell-ink:#ECEBE6;--shell-muted:#A09E97;--shell-line:#2E2D2A}}
:root[data-theme="dark"]{--shell:#121211;--shell-ink:#ECEBE6;--shell-muted:#A09E97;--shell-line:#2E2D2A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--shell);color:var(--shell-ink);font-family:var(--f);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top */
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--hot);display:grid;place-items:center;color:#141414;font-weight:800;font-size:13px}
.logo small{display:block;color:var(--shell-muted);font-weight:400;font-size:12px}
.sp{flex:1}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--shell-line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:12.5px;color:var(--shell-muted);white-space:nowrap}
.seg button.on{background:var(--shell-ink);color:var(--shell);font-weight:700}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:9px;height:9px;border-radius:50%;background:var(--shell-line);padding:0}
.dots button.on{background:var(--hot);width:22px;border-radius:9px}
.dots button.done{background:var(--shell-muted)}

/* stage */
.stage{flex:1;display:grid;grid-template-columns:360px minmax(0,1fr);gap:0;margin:0 14px;border-radius:26px;background:var(--glow),var(--ground);color:var(--ink);overflow:hidden;min-height:0}
.cap{padding:34px 30px 24px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.time{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.time b{font-size:30px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2);width:fit-content;font-weight:700}
.cap h2{margin:0;font-size:27px;line-height:1.3;font-weight:800;letter-spacing:-.3px;text-wrap:balance}
.cap p{margin:0;color:var(--ink-2);font-size:15px}
.why{margin-top:4px;background:var(--surface);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.why b{display:block;color:var(--ink);font-size:12px;margin-bottom:2px}
.cap .fill{flex:1}
.ctrl{display:flex;align-items:center;gap:8px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:999px;font-size:13.5px;border:1px solid rgba(20,20,20,.1);background:rgba(255,255,255,.85);white-space:nowrap}
.b:hover{background:#fff}
.b.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.b.hot{background:var(--hot);border-color:var(--hot);color:#141414;font-weight:700}
.b.ic{padding:10px 12px}
.b[disabled]{opacity:.35;pointer-events:none}
.count{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted)}

.devwrap{position:relative;display:grid;place-items:center;padding:24px;min-height:0;overflow:hidden}
.dev{transform-origin:center center;transition:opacity .35s ease}
.dev.fade{opacity:0}

/* phone */
.phone{width:330px;height:680px;border-radius:52px;background:#141414;padding:12px;box-shadow:0 30px 70px rgba(60,40,20,.25)}
.scr{position:relative;width:100%;height:100%;border-radius:41px;background:var(--glow),#EFEEE9;overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:20px;background:#141414;z-index:5}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-size:13px;font-weight:700;direction:ltr}
.ah{display:flex;align-items:center;gap:10px;padding:10px 16px 12px}
.crest{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ah b{display:block;font-size:14px}
.ah small{color:var(--muted);font-size:11.5px}
.body{flex:1;overflow:hidden;padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:12px 14px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 24px rgba(60,40,20,.05)}
.card h4{margin:0 0 6px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.sub{color:var(--muted);font-size:11.5px}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);opacity:0;transform:translateY(6px);transition:all .4s ease}
.item:first-of-type{border-top:0}
.item.in{opacity:1;transform:none}
.item .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.item .t{font-size:12.8px;font-weight:700}
.item .d{font-size:11.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--hot-soft);color:var(--hot-ink);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.br{background:var(--brand-soft);color:var(--brand-2);border-color:transparent}
.hl{box-shadow:0 0 0 2px var(--hot) inset;border-radius:12px}

/* teacher list */
.st{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.6);transition:background .3s}
.st .av{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-2)}
.st .n{flex:1;font-size:12.8px}
.st .s{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700;transition:all .3s}
.st.ab .s{background:var(--hot-soft);color:var(--hot-ink)}
.st.lt .s{background:var(--warn-soft);color:var(--warn)}
.st.ab{background:rgba(251,231,220,.6)}
.sumbar{display:flex;gap:6px;flex-wrap:wrap}
.save{margin-top:auto;background:var(--ink);color:#fff;border-radius:16px;padding:13px;text-align:center;font-weight:700;font-size:14px;transition:transform .15s}
.save.press{transform:scale(.96)}
.toast{position:absolute;left:14px;right:14px;bottom:18px;background:#141414;color:#fff;border-radius:16px;padding:12px 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);z-index:6}
.toast.in{transform:none}
.toast .ok{width:26px;height:26px;border-radius:50%;background:#2E6B4F;display:grid;place-items:center;flex:none}

/* lock screen */
.scr:has(.lock) .sbar{background:#4a3b36;color:#fff}
.lock{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:40px;color:#fff;background:linear-gradient(160deg,#4a3b36,#1f1b1a 60%,#2b2421)}
.lock .big{font-size:68px;font-weight:300;letter-spacing:-2px;direction:ltr;line-height:1}
.lock .date{font-size:14px;opacity:.85;margin-top:6px}
.notif{margin:22px 12px 0;align-self:stretch;background:rgba(255,255,255,.88);color:#141414;border-radius:22px;padding:12px 14px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:translateY(-160%) scale(.95);opacity:0;transition:all .55s cubic-bezier(.2,.9,.3,1.15)}
.notif.in{transform:none;opacity:1}
.notif .h{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#55534D}
.notif .h .crest{width:22px;height:22px;border-radius:6px;font-size:10px}
.notif .h .tm{margin-inline-start:auto}
.notif b{display:block;font-size:13.5px;margin-top:6px}
.notif p{margin:2px 0 0;font-size:12.5px;color:#333}
.buzz{animation:buzz .5s ease 2}
@keyframes buzz{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-1deg)}40%{transform:translateX(4px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* chat */
.chat{flex:1;display:flex;flex-direction:column;gap:8px;padding:6px 2px;overflow:hidden}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;font-size:12.8px;opacity:0;transform:translateY(8px);transition:all .4s}
.bub.in{opacity:1;transform:none}
.bub.me{align-self:flex-start;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bub.them{align-self:flex-end;background:#fff;border-bottom-left-radius:5px}
.bub .m{display:block;font-size:10.5px;opacity:.7;margin-top:3px;text-align:left}
.sys{align-self:center;font-size:10.8px;color:var(--muted);background:rgba(255,255,255,.7);border-radius:999px;padding:4px 12px;opacity:0;transition:opacity .4s;text-align:center}
.sys.in{opacity:1}
.typing{align-self:flex-start;display:flex;gap:4px;padding:10px 12px;background:rgba(255,255,255,.7);border-radius:14px;opacity:0;transition:opacity .3s}
.typing.in{opacity:1}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3}50%{opacity:1}}
.att{display:flex;gap:8px;align-items:center;margin-top:6px;background:var(--sunk);border-radius:10px;padding:6px 8px;font-size:11.5px}
.composer{display:flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:8px 8px 8px 14px;font-size:12.5px;color:var(--muted)}
.composer .snd{margin-inline-start:auto;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}

/* pay */
.bal{background:var(--brand);color:#fff;border-radius:20px;padding:16px}
.bal small{opacity:.8;font-size:12px}
.bal .amt{font-size:30px;font-weight:800;letter-spacing:-.5px}
.paybtn{background:var(--ink);color:#fff;border-radius:16px;padding:13px;text-align:center;font-weight:700;transition:transform .15s}
.paybtn.press{transform:scale(.96)}
.paybtn.done{background:var(--ok)}
.methods{display:flex;gap:6px;flex-wrap:wrap}
.rec{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 10px;opacity:0;transform:scale(.95);transition:all .45s}
.rec.in{opacity:1;transform:none}
.rec .big-ok{width:58px;height:58px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* laptop */
.laptop{width:900px}
.lscr{background:#141414;border-radius:20px 20px 0 0;padding:12px 12px 0}
.lin{height:540px;border-radius:10px 10px 0 0;background:var(--glow),#EFEEE9;overflow:hidden;display:grid;grid-template-columns:170px minmax(0,1fr)}
.lbase{height:18px;background:linear-gradient(#cfcdc6,#b9b7b0);border-radius:0 0 18px 18px;margin:0 -30px;position:relative}
.lbase:after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:7px;border-radius:0 0 8px 8px;background:#a9a7a0}
.lside{background:rgba(20,20,20,.88);color:#fff;margin:10px 0 10px 10px;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.lside .sch{display:flex;gap:8px;align-items:center;padding:4px 4px 10px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.lside .sch .crest{width:28px;height:28px;font-size:12px;border-radius:8px}
.lside .sch b{font-size:11.5px;display:block;line-height:1.3}
.lside .sch small{color:#A9A7A0;font-size:10px}
.lside .nv{padding:7px 10px;border-radius:10px;color:#A9A7A0;display:flex;align-items:center;gap:8px}
.lside .nv.on{background:rgba(255,255,255,.95);color:#141414;font-weight:700}
.lside .nv svg{width:15px;height:15px}
.lmain{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.lh{display:flex;align-items:flex-end;gap:12px}
.lh h3{margin:0;font-size:19px;font-weight:800}
.lh p{margin:0;color:var(--muted);font-size:12px}
.lh .r{margin-inline-start:auto;display:flex;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi .k{font-size:11.5px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:400}
.aging{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ag .bar{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:8px 0 4px}
.ag .bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s ease}
table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{font-weight:400;color:var(--muted);font-size:11px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.t td{padding:7px 8px;border-bottom:1px solid var(--line)}
.t tr:last-child td{border-bottom:0}
.t td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.btnl{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.85);border:1px solid var(--line)}
.btnl.hot{background:var(--hot);border-color:var(--hot);color:#141414;font-weight:700;transition:transform .15s}
.btnl.hot.press{transform:scale(.95)}
.btnl.done{background:var(--ok);border-color:var(--ok);color:#fff}
.drawer{position:absolute;top:10px;bottom:10px;left:10px;width:330px;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(60,40,20,.2);padding:14px 16px;transform:translateX(-112%);transition:transform .5s cubic-bezier(.2,.9,.3,1.05);display:flex;flex-direction:column;gap:8px;font-size:12px}
.drawer.in{transform:none}
.drawer h4{margin:0;font-size:15px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ln .a{font-variant-numeric:tabular-nums;white-space:nowrap}
.ln.disc .a{color:var(--ok)}
.ln.tot{border-bottom:0;font-weight:800;font-size:14px;padding-top:10px}
.ln.tot .a{color:var(--hot-ink)}
.bars{display:flex;align-items:flex-end;gap:14px;height:120px;padding-top:6px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .c i{display:block;width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:var(--brand);height:0;transition:height .9s ease}
.bars .c span{font-size:10.5px;color:var(--muted)}
.bars .c b{font-size:11px}
.prog{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--ok);border-radius:6px;transition:width 1.2s ease}
.lgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}

/* intro / outro */
.full{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:16px}
.full h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-.8px;line-height:1.2;text-wrap:balance;max-width:760px}
.full p{margin:0;font-size:17px;color:var(--ink-2);max-width:600px}
.full .kick{font-size:13px;color:var(--hot-ink);background:var(--hot-soft);padding:5px 14px;border-radius:999px;font-weight:700}
.full .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.tl span{font-size:12px;color:var(--ink-2);background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:5px 12px}
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:880px;width:100%;margin-top:6px}
.rc{background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:14px 16px;text-align:right;opacity:0;transform:translateY(8px);transition:all .45s}
.rc.in{opacity:1;transform:none}
.rc .tm{font-size:11.5px;color:var(--muted)}
.rc b{display:block;font-size:14.5px;margin:2px 0}
.rc p{font-size:12.5px;margin:0;color:var(--ink-2)}

.soon{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 11px;border-radius:999px;background:var(--hot);color:#141414;font-weight:700;width:fit-content}
.whorow{display:flex;gap:8px;flex-wrap:wrap}
.appr{display:flex;gap:8px;margin-top:8px}
.appr span{flex:1;text-align:center;padding:10px;border-radius:12px;font-weight:700;font-size:13px;transition:all .2s}
.appr .no{background:var(--sunk)}
.appr .yes{background:var(--ink);color:#fff}
.appr .yes.press{transform:scale(.95)}
.done-box{display:none;margin-top:8px;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:12.5px}
.done-box.in{display:block}
.ai{display:flex;flex-direction:column;gap:7px;flex:1;overflow:hidden}
.ai .t td{padding:5px 8px}
.ai .ans{padding:10px 12px}
.q{align-self:flex-start;background:var(--ink);color:#fff;border-radius:16px 16px 16px 5px;padding:10px 14px;font-size:13px;max-width:70%;opacity:0;transform:translateY(6px);transition:all .4s}
.q.in{opacity:1;transform:none}
.ans{background:#fff;border-radius:16px;padding:12px 14px;font-size:12.5px;opacity:0;transform:translateY(6px);transition:all .45s;border:1px solid var(--line)}
.ans.in{opacity:1;transform:none}
.ans .src{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center}
.draft{border:1.5px dashed var(--hot);background:#FFF9F5}
.typed:after{content:"▍";animation:ty 1s infinite}
.foot{padding:10px 18px 14px;font-size:11.5px;color:var(--shell-muted);display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;grid-template-rows:auto minmax(420px,1fr)}
  .cap{border-left:0;border-bottom:1px solid var(--line);padding:18px 18px 14px;gap:8px}
  .cap h2{font-size:21px}
  .cap p{font-size:14px}
  .why,.cap .fill,.hint{display:none}
  .time b{font-size:22px}
  .full h1{font-size:30px}
  .recap{grid-template-columns:1fr 1fr}

const $$=s=>[...document.querySelectorAll(s)];

function phone(inner,time){return `<div class="phone"><div class="scr"><div class="island"></div><div class="sbar"><span class="num">${time}</span><span>●●● ▮</span></div>${inner}</div></div>`}
function appHead(title,sub){const d=D();return `<div class="ah"><div class="crest">${d.crest}</div><div><b>${title}</b><small>${sub}</small></div></div>`}
function laptop(navOn,main){const d=D();
 const nav=[['home','الرئيسية'],['users','الطلاب'],['check','الغياب'],['money','الرسوم'],['chat','الرسايل'],['chart','التقارير']];
 return `<div class="laptop"><div class="lscr"><div class="lin">
   <div class="lside"><div class="sch"><div class="crest">${d.crest}</div><div><b>${d.school}</b><small>لوحة الإدارة</small></div></div>
   ${nav.map(n=>`<div class="nv ${n[1]===navOn?'on':''}">${I(n[0])}${n[1]}</div>`).join('')}</div>
   <div class="lmain">${main}</div></div></div><div class="lbase"></div></div>`}

function fit(){const w=$('.devwrap'),dv=$('.dev');if(!w||!dv)return;const el=dv.firstElementChild;if(!el)return;
 dv.style.transform='none';dv.style.zoom='';dv.style.margin='';const nw=el.offsetWidth,nh=el.offsetHeight;const aw=w.clientWidth-32,ah=w.clientHeight-32;

    <span class="count num">${CUR} / ${SCENES.length-2}</span></div>
   <div class="hint">اضغط التالي، أو خليه يمشي لوحده</div>
  </section><section class="devwrap"><div class="dev fade">${sc.render()}</div></section>`;
  setTimeout(()=>{try{fit()}catch(e){}setTimeout(()=>{const d=$('.dev');if(d)d.classList.remove('fade')},40)},20);}
 renderDots();
 const mc=$('#mctrl');if(mc){mc.classList.toggle('hide',!!sc.full);mc.innerHTML=sc.full?'':`<button class="b ic" data-go="prev" aria-label="اللي فات">${I('prev')}</button><button class="b pri" data-go="toggle">${PLAYING?I('pause')+' وقّف':I('play')+' شغّل لوحده'}</button><span class="count num">${CUR} / ${SCENES.length-2}</span><button class="b hot" data-go="next" aria-label="اللي بعده">${I('next')} التالي</button>`}
 if(innerWidth<=700)scrollTo({top:0});
 const pb=$('#pb');if(pb){pb.style.transition='none';pb.style.width='0';if(PLAYING&&sc.dur&&CUR<SCENES.length-1){void pb.offsetWidth;pb.style.transition=`width ${sc.dur}ms linear`;pb.style.width='100%'}}
 sc.play&&sc.play(ok);
 if(PLAYING&&sc.dur&&CUR<SCENES.length-1)TIMER=setTimeout(()=>{if(ok())show(CUR+1)},sc.dur);
 if(CUR===SCENES.length-1)PLAYING=false;
}

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');const dt=e.target.closest('[data-dot]');const ty=e.target.closest('[data-type]');
 if(g){const v=g.dataset.go;
  if(v==='next'){if(CUR===0)PLAYING=true;show(CUR+1)}
  else if(v==='prev')show(CUR-1);
  else if(v==='toggle'){PLAYING=!PLAYING;show(CUR)}
  else show(+v)}
 if(dt){PLAYING=false;show(+dt.dataset.dot)}
 if(ty){TYPE=ty.dataset.type;document.body.dataset.type=TYPE;$$('#typeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.type===TYPE));show(CUR)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'){PLAYING=false;show(CUR+1)}
 else if(e.key==='ArrowRight'){PLAYING=false;show(CUR-1)}
 else if(e.key===' '){e.preventDefault();PLAYING=!PLAYING;show(CUR)}
});
addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(()=>{try{fit()}catch(e){}});
show(0);
</script>
</body>
</html>
