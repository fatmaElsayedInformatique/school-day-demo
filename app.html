lTlpY6O/lKx3JWysxqt95xmx7pXYRYA) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212,U+2713}
:root{
 --bg:#EFEEE9;--glow:radial-gradient(520px 380px at 90% -8%,rgba(242,176,138,.42),transparent 70%),radial-gradient(520px 420px at 0% 108%,rgba(222,208,190,.6),transparent 70%);
 --card:rgba(255,255,255,.72);--solid:#fff;--line:rgba(20,20,20,.08);--line2:rgba(20,20,20,.14);--sunk:rgba(20,20,20,.06);
 --ink:#141414;--ink2:#55534D;--muted:#8C8A83;
 --brand:#2F6B58;--brand2:color-mix(in srgb,var(--brand) 62%,#000);--soft:color-mix(in srgb,var(--brand) 12%,#fff);
 --hot:#E8764A;--hotsoft:#FBE7DC;--hotink:#8A3B1C;--ok:#2E6B4F;--oksoft:#E3EEE7;--warn:#7A5510;--warnsoft:#F6EACB;
 --f:"Readex","Almarai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
 --ease:cubic-bezier(.2,.9,.3,1.15);
 color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E6E5E0;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- stage: phone on desktop, full screen on mobile ---------- */
.stage{height:100dvh;display:flex;align-items:center;justify-content:center;gap:56px;padding:20px}
.pitch{max-width:340px;display:none;flex-direction:column;gap:16px}
.pitch .mk{width:44px;height:44px;border-radius:14px;background:var(--hot);display:grid;place-items:center;font-weight:800;color:#141414}
.pitch h1{margin:0;font-size:34px;line-height:1.25;letter-spacing:-.5px}
.pitch p{margin:0;color:var(--ink2);font-size:15px}
.pitch .qr{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(60,40,20,.08)}
.pitch .qr svg{width:120px;height:120px;flex:none}
.pitch .qr b{display:block;font-size:14px}
.pitch .qr small{color:var(--muted);font-size:12px}
.device{position:relative;width:100%;height:100%;background:var(--glow),var(--bg);overflow:hidden}
@media (min-width:760px){
 .pitch{display:flex}
 .device{width:390px;height:min(844px,calc(100dvh - 40px));border-radius:54px;box-shadow:0 0 0 11px #141414,0 40px 90px rgba(60,40,20,.3);flex:none}
 .device::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#141414;z-index:100}
 .device .safe-top{height:48px!important}
}
.safe-top{height:env(safe-area-inset-top,0px);flex:none}

/* ---------- generic ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:20px}
.scroll::-webkit-scrollbar{display:none}
.enter{animation:enter .38s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flash{0%{background:var(--hotsoft);box-shadow:0 0 0 0 rgba(232,118,74,.35)}70%{background:var(--hotsoft)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,118,74,.5)}50%{box-shadow:0 0 0 9px rgba(232,118,74,0)}}
.card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:22px;margin:0 14px 12px;padding:14px 16px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 24px rgba(60,40,20,.04)}
.card h3{margin:0 0 8px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.card h3 .r{margin-inline-start:auto;font-weight:400;font-size:12px;color:var(--brand)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.hot{background:var(--hot);color:#141414}
.btn.ghost{background:rgba(255,255,255,.75);color:var(--ink);border:1px solid var(--line2)}
.btn.brand{background:var(--brand)}
.btn.sm{width:auto;padding:9px 16px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--oksoft);color:var(--ok)}.chip.hot{background:var(--hotsoft);color:var(--hotink)}.chip.warn{background:var(--warnsoft);color:var(--warn)}
.flash{animation:flash 1.8s ease-out}
.muted{color:var(--muted)}

/* ---------- onboarding ---------- */
.ob{position:absolute;inset:0;display:flex;flex-direction:column;background:#141414;color:#fff;z-index:50}
.ob .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:18px;font-size:13px;color:#A09E97;z-index:2;padding:6px}
@media (min-width:760px){.ob .skip{top:58px}}
.ob .slides{flex:1;display:flex;transition:transform .45s var(--ease);touch-action:pan-y}
.ob .sl{min-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 28px 10px;gap:16px}
.ob h2{margin:0;font-size:27px;line-height:1.3;letter-spacing:-.3px}
.ob p{margin:0;color:#C9C7C0;font-size:15px;line-height:1.7}
.ob .foot{padding:16px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
.ob .dots{display:flex;gap:6px}
.ob .dots i{width:7px;height:7px;border-radius:7px;background:rgba(255,255,255,.25);transition:all .3s}
.ob .dots i.on{width:22px;background:var(--hot)}
.wa{width:250px;border-radius:22px;overflow:hidden;background:#E9E2D7;text-align:right;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.wa .h{background:#0B6E5F;display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px}
.wa .h b{display:block}.wa .h small{opacity:.8;font-size:10.5px}
.wa .h .u{margin-inline-start:auto;background:#25D366;color:#073b2f;font-weight:800;border-radius:20px;padding:1px 9px;font-size:12px}
.wa .ms{height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:8px;overflow:hidden}
.wa .m{align-self:flex-end;background:#fff;color:#141414;border-radius:11px 11px 11px 3px;padding:5px 9px;font-size:11.5px;max-width:88%;animation:enter .3s ease-out both}
.wa .m i{display:block;font-style:normal;font-size:10px;font-weight:800}
.mini-today{width:260px;background:var(--bg);color:var(--ink);border-radius:24px;padding:12px;text-align:right;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mini-today .hr{border-radius:16px;padding:12px;background:linear-gradient(140deg,var(--brand),var(--brand2));color:#fff;margin-bottom:8px}
.mini-today .hr small{font-size:10.5px;opacity:.8}.mini-today .hr b{display:block;font-size:17px}
.mini-today .rw{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line2);font-size:12px;opacity:0;animation:enter .4s ease-out forwards}
.mini-today .rw:last-child{border:0}
.mini-today .rw .s{width:26px;height:26px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.mini-today .rw .c{margin-inline-start:auto;color:var(--ok)}
.roles{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px}
.rolebtn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);text-align:right;transition:transform .15s,background .2s}
.rolebtn:active{transform:scale(.97)}
.rolebtn .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.rolebtn b{display:block;font-size:16px}
.rolebtn small{color:#A09E97;font-size:12px}
.rolebtn .ar{margin-inline-start:auto;color:#A09E97}

/* ---------- app header & tabs ---------- */
.hd{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.crest{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.hd .t{flex:1;min-width:0}
.hd .t b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t small{color:var(--muted);font-size:11.5px}
.rolepill{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700}
.rolepill .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.quest{margin:0 14px 10px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:rgba(20,20,20,.88);color:#fff;font-size:12.5px;flex:none;width:calc(100% - 28px);text-align:right}
.quest .st{display:flex;gap:4px}
.quest .st i{width:18px;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
.quest .st i.on{background:var(--hot)}
.quest b{flex:1}
.tabs{flex:none;display:flex;justify-content:space-around;margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));padding:8px 4px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(60,40,20,.08)}
@media (min-width:760px){.tabs{margin-bottom:20px}}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);min-width:56px;position:relative;padding:2px 0}
.tabs button.on{color:var(--ink);font-weight:800}
.tabs button.on::after{content:"";position:absolute;bottom:-6px;width:18px;height:3px;border-radius:3px;background:var(--brand)}
.tabs svg.i{width:23px;height:23px}
.tabs .bd{position:absolute;top:-2px;left:12px;background:var(--hot);color:#141414;border-radius:10px;font-size:9.5px;padding:0 5px;font-weight:800}
.title{padding:2px 18px 10px;font-size:25px;font-weight:800;letter-spacing:-.3px}
.sub{padding:0 18px 12px;margin-top:-8px;color:var(--muted);font-size:12.5px}

/* ---------- parent ---------- */
.hero{margin:0 14px 12px;border-radius:24px;padding:16px;color:#fff;background:linear-gradient(140deg,var(--brand),var(--brand2));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -50px -70px auto;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.8;font-size:12px}
.hero b{display:block;font-size:22px;margin:2px 0 8px}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.hero .pills span{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 10px;font-size:11.5px}
.kids{display:flex;gap:8px;padding:0 16px 12px}
.kid{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);font-size:12.5px}
.kid.on{background:var(--ink);color:#fff}
.kid .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:800}
.ls{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line2);border-radius:12px;align-items:flex-start}
.ls:last-child{border-bottom:0}
.ls .s{width:36px;height:36px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.ls .x{flex:1;min-width:0}
.ls .x b{display:block;font-size:13.5px}
.ls .x small{display:block;font-size:11.5px;color:var(--muted)}
.ls .it{display:flex;gap:5px;font-size:12.5px;color:var(--ink2);margin-top:3px;align-items:flex-start}
.ls .it svg{width:14px;height:14px;color:var(--ok);stroke-width:2.7;margin-top:3px}
.ls .hw{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;margin-top:5px;background:var(--warnsoft);color:var(--warn);padding:2px 9px;border-radius:20px}
.ls .hw svg{width:13px;height:13px}
.ls .tm{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:2px}
.ls.pend .s{background:var(--sunk)!important;color:var(--muted)}
.ls.up{opacity:.5}
.pp{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pp.now{background:var(--hotsoft);color:var(--hotink)}
.mr{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.mr:last-child{border:0}
.mr .d{margin-inline-start:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.mr .dt{width:8px;height:8px;border-radius:50%;flex:none}
.wait{border:1.5px solid rgba(122,85,16,.35);background:linear-gradient(180deg,rgba(246,234,203,.8),rgba(255,255,255,.6))}
.wait h3{color:var(--warn)}
.two{display:flex;gap:8px}
.prog{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.prog:last-child{border:0}
.prog .c{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--line2);display:grid;place-items:center;flex:none;font-size:10px;color:var(--muted)}
.prog.on .c{background:var(--brand);border-color:var(--brand);color:#fff}
.prog.on .c svg{width:13px;height:13px;stroke-width:3}
.prog.on span{color:var(--ink2)}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .8s var(--ease)}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 14px 10px}
.bub{max-width:80%;padding:9px 13px;border-radius:18px;font-size:13.5px;animation:enter .3s ease-out both}
.bub.me{align-self:flex-start;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bub.them{align-self:flex-end;background:#fff;border-bottom-left-radius:5px}
.bub .m{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.sysm{align-self:center;font-size:11px;color:var(--muted);background:rgba(255,255,255,.7);border-radius:999px;padding:4px 12px;text-align:center}
.typing{align-self:flex-end;display:flex;gap:4px;padding:11px 13px;background:#fff;border-radius:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.25}50%{opacity:1}}
.composer{flex:none;display:flex;gap:8px;align-items:center;margin:0 12px 10px;background:#fff;border-radius:999px;padding:6px 6px 6px 8px;border:1px solid var(--line)}
.composer input{flex:1;border:0;outline:0;background:none;padding:6px 10px;font-size:14px;min-width:0}
.composer button{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.thread{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:right}
.thread:last-child{border:0}
.thread .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.thread .x{flex:1;min-width:0}.thread .x b{display:block;font-size:13.5px}.thread .x small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* fees */
.bal{margin:0 14px 12px;border-radius:24px;padding:18px;background:var(--ink);color:#fff}
.bal small{color:#A09E97}.bal .a{font-size:32px;font-weight:800;letter-spacing:-.5px}
.pay{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:rgba(255,255,255,.7);width:100%;text-align:right;margin-bottom:8px}
.pay.on{border-color:var(--ink);background:#fff}
.pay .lg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:10.5px;flex:none}

/* ---------- teacher ---------- */
.lrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:0}
.lrow .tm{width:42px;font-size:12px;color:var(--muted);flex:none}
.lrow .x{flex:1}.lrow .x b{display:block;font-size:13.5px}.lrow .x small{font-size:11.5px;color:var(--muted)}
.ck{display:flex;align-items:center;gap:11px;width:100%;padding:13px;border-radius:16px;background:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.95);font-size:14px;text-align:right;margin-bottom:7px;transition:all .15s}
.ck .bx{width:24px;height:24px;border-radius:8px;border:1.8px solid var(--line2);display:grid;place-items:center;flex:none;background:#fff;transition:all .18s}
.ck .bx svg{width:15px;height:15px;stroke-width:3;opacity:0;transform:scale(.3);transition:all .18s}
.ck.on{border-color:var(--brand);background:var(--soft)}
.ck.on .bx{background:var(--brand);border-color:var(--brand);color:#fff}
.ck.on .bx svg{opacity:1;transform:none}
.ck .was{margin-inline-start:auto;font-size:10.5px;color:var(--muted)}
.togl{display:flex;align-items:center;gap:10px;width:100%;font-size:14px;font-weight:800;text-align:right}
.sw{width:42px;height:25px;border-radius:20px;background:var(--line2);position:relative;transition:background .2s;margin-inline-start:auto;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}.sw.on::after{transform:translateX(-17px)}
.cls{display:flex;gap:7px;flex-wrap:wrap}
.cls button{padding:8px 15px;border-radius:999px;border:1.5px solid var(--line2);font-size:13px;background:rgba(255,255,255,.7);display:inline-flex;gap:5px;align-items:center}
.cls button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cls button svg{width:14px;height:14px;stroke-width:2.6}
.timer{display:flex;justify-content:center;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.timer b{font-size:15px;color:var(--ink);min-width:18px;text-align:center}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.9);font-size:14px;width:100%;min-width:0;outline:0}
.field input:focus,.field select:focus{border-color:var(--brand)}

/* ---------- principal ---------- */
.ring{display:flex;align-items:center;gap:16px}
.nodes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 12px}
.node{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:12px 14px}
.node .l{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.node .l i{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.node .v{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.node .v small{font-size:12px;color:var(--muted);font-weight:400}
.node.hotn{background:linear-gradient(180deg,rgba(251,231,220,.9),rgba(255,255,255,.65))}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:0}
.trow .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.trow .x{flex:1;min-width:0}.trow .x b{display:block;font-size:13.5px}.trow .x small{font-size:11.5px;color:var(--muted)}
.pd{display:flex;gap:3px;direction:ltr;margin-top:4px;justify-content:flex-end}
.pd i{width:13px;height:13px;border-radius:4px;background:var(--sunk)}
.pd i.ok{background:var(--brand)}.pd i.lt{background:var(--hot)}.pd i.up{background:transparent;border:1.5px dashed var(--line2)}.pd i.cv{background:#8FB9A8}
.aud{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.aud button{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line2);font-size:12.5px;background:rgba(255,255,255,.7)}
.aud button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.field textarea{padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.9);font-size:14px;min-height:84px;resize:none;outline:0}

/* ---------- overlays ---------- */
.push{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:70;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:11px 13px;box-shadow:0 14px 34px rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start;animation:drop .5s var(--ease)}
@media (min-width:760px){.push{top:52px}}
@keyframes drop{from{transform:translateY(-130%)}to{transform:none}}
.push .crest{width:34px;height:34px;font-size:13px;border-radius:9px}
.push .x{flex:1;min-width:0;font-size:12.5px}
.push .x .tt{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.push .x b{display:block;font-size:13.5px}
.sheet-bg{position:absolute;inset:0;z-index:80;background:rgba(10,10,10,.35);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(60%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet .lead{margin:0 0 14px;color:var(--ink2);font-size:13.5px}
.rl{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:18px;background:rgba(255,255,255,.7);border:1.5px solid transparent;text-align:right;margin-bottom:8px}
.rl.on{border-color:var(--ink);background:#fff}
.rl .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.rl b{display:block;font-size:15px}.rl small{font-size:12px;color:var(--muted)}
.rl .ck2{margin-inline-start:auto}
.done{position:absolute;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px;background:rgba(239,238,233,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s}
.done .ck{width:96px;height:96px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;animation:pop .55s var(--ease);box-shadow:0 0 0 12px color-mix(in srgb,var(--brand) 14%,transparent),0 0 0 26px color-mix(in srgb,var(--brand) 6%,transparent)}
.done .ck svg{width:48px;height:48px;stroke-width:2.6}
.done .sec{font-size:48px;font-weight:800;color:var(--brand);line-height:1}
.done b{font-size:21px}
.done p{margin:0;color:var(--ink2);font-size:14px}
.conf{position:absolute;top:40%;left:50%;width:9px;height:9px;border-radius:2px;animation:conf 1.1s ease-out forwards;pointer-events:none}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.hint{position:absolute;z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:11px 13px;font-size:12.8px;line-height:1.55;box-shadow:0 14px 30px rgba(0,0,0,.25);animation:enter .35s var(--ease) both;max-width:280px}
.hint b{color:var(--hot)}
.hint .hb{display:flex;gap:6px;margin-top:8px}
.hint .hb button{background:var(--hot);color:#141414;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px}
.hint .hb button.g{background:rgba(255,255,255,.12);color:#fff}
.hint::after{content:"";position:absolute;width:12px;height:12px;background:var(--ink);transform:rotate(45deg);right:30px}
.hint.below::after{top:-5px}.hint.above::after{bottom:-5px}
.glow{animation:pulse 1.6s infinite;border-radius:16px;position:relative;z-index:2}
.toast{position:absolute;left:14px;right:14px;bottom:92px;z-index:85;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;animation:enter .3s var(--ease)}
.toast svg{color:#8FD3B6}
.cta-card{margin:0 14px 12px;border-radius:24px;padding:18px;background:linear-gradient(150deg,#E8764A,#B5532C);color:#fff}
.cta-card b{display:block;font-size:19px;margin-bottom:4px}
.cta-card p{margin:0 0 12px;font-size:13.5px;opacity:.92}
.cta-card .btn{background:#fff;color:#8A3B1C}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.mods span{font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.mods span svg{width:14px;height:14px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots button{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line2);font-size:13px;background:rgba(255,255,255,.7)}
.slots button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ================= v3 · حديث ومبهر ================= */
/* signature: the day as live slots, on a dark card */
.day{margin:0 14px 14px;border-radius:26px;padding:18px 16px 14px;color:#fff;position:relative;overflow:hidden;
 background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--brand) 70%,transparent),transparent 62%),radial-gradient(90% 70% at 0% 100%,rgba(232,118,74,.28),transparent 60%),#101413;
 box-shadow:0 18px 40px rgba(16,20,19,.22)}
.day .k{display:flex;align-items:flex-start;gap:10px}
.day .k b{font-size:44px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.day .k small{white-space:nowrap;font-size:11.5px;color:rgba(255,255,255,.6);margin-inline-start:auto;text-align:left;line-height:1.45;padding-top:4px}
.day .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#9FE3C4;background:rgba(159,227,196,.1);border:1px solid rgba(159,227,196,.22);border-radius:999px;padding:2px 9px;margin-top:8px}
.day .live i{width:6px;height:6px;border-radius:50%;background:#5FD3A1;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.day .sum{font-size:13px;color:rgba(255,255,255,.82);margin:12px 0 12px}
.day .sum b{color:#fff;font-weight:800}
.pers{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:6px}
.pers i{height:38px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-style:normal;transition:all .5s var(--ease);position:relative}
.pers i svg{width:16px;height:16px;stroke-width:3}
.pers i.ok{background:#fff;border-color:#fff;color:var(--brand)}
.pers i.pend{border:1.5px dashed rgba(255,255,255,.4);color:rgba(255,255,255,.6);font-size:13px;font-weight:800}
.pers i.now{background:var(--hot);border-color:var(--hot);box-shadow:0 0 0 0 rgba(232,118,74,.6);animation:nowp 1.8s infinite}
.pers i.now::after{content:"";width:7px;height:7px;border-radius:50%;background:#141414}
@keyframes nowp{0%,100%{box-shadow:0 0 0 0 rgba(232,118,74,.55)}50%{box-shadow:0 0 0 7px rgba(232,118,74,0)}}
.pers i.up{opacity:.4}
.pers i.na{background:rgba(255,255,255,.12);border-color:transparent}
.pers i.just{animation:fillIn 1s var(--ease)}
@keyframes fillIn{0%{background:transparent;transform:scale(.7)}55%{transform:scale(1.15);box-shadow:0 0 22px rgba(255,255,255,.7)}100%{background:#fff;transform:none}}
.plab{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:6px;margin-top:6px;font-size:10px;color:rgba(255,255,255,.5);text-align:center}
.day.t{background:radial-gradient(120% 90% at 100% 0%,rgba(232,118,74,.55),transparent 62%),radial-gradient(90% 70% at 0% 100%,color-mix(in srgb,var(--brand) 45%,transparent),transparent 60%),#101413}
.day .act{margin-top:14px}
.day .act .btn{background:#fff;color:#141414}
/* subject glyph tiles */
.s.g{background:color-mix(in srgb,var(--sc) 13%,#fff)!important;color:var(--sc)!important;font-size:18px;font-weight:800}
.s.g svg{width:19px;height:19px;stroke-width:2}
.ls.pend .s.g{filter:grayscale(1);opacity:.55}
.ls .it svg{color:var(--brand)}
/* role switch: full-screen wipe */
.wipe{position:absolute;inset:0;z-index:95;background:var(--wc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;clip-path:circle(0% at 16% 7%);animation:wipe 1s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
.wipe .ic{width:74px;height:74px;border-radius:24px;background:rgba(255,255,255,.16);display:grid;place-items:center;animation:pop .5s .2s var(--ease) both}

<body>
<div class="stage">
 <div class="pitch" id="pitch"></div>
 <div class="device" id="device"></div>
</div>
<script>
var qrcode = function() {
  var qrcode = function(typeNumber, errorCorrectionLevel) {
    var PAD0 = 0xEC;
    var PAD1 = 0x11;
    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];
    var _this = {};
    var makeImpl = function(test, maskPattern) {
      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);
      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);
      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }
      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }
      mapData(_dataCache, maskPattern);
    };
    var setupPositionProbePattern = function(row, col) {
      for (var r = -1; r <= 7; r += 1) {
        if (row + r <= -1 || _moduleCount <= row + r) continue;
        for (var c = -1; c <= 7; c += 1) {
          if (col + c <= -1 || _moduleCount <= col + c) continue;
          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };
    var getBestMaskPattern = function() {
      var minLostPoint = 0;
      var pattern = 0;
      for (var i = 0; i < 8; i += 1) {
        makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(_this);
        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }
      return pattern;
    };
    var setupTimingPattern = function() {
      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };
    var setupPositionAdjustPattern = function() {
      var pos = QRUtil.getPatternPosition(_typeNumber);
      for (var i = 0; i < pos.length; i += 1) {
        for (var j = 0; j < pos.length; j += 1) {
          var row = pos[i];
          var col = pos[j];
          if (_modules[row][col] != null) {
            continue;
          }
          for (var r = -2; r <= 2; r += 1) {
            for (var c = -2; c <= 2; c += 1) {
              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };
    var setupTypeNumber = function(test) {
      var bits = QRUtil.getBCHTypeNumber(_typeNumber);
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };
    var setupTypeInfo = function(test, maskPattern) {
      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }
      _modules[_moduleCount - 8][8] = (!test);
    };
    var mapData = function(data, maskPattern) {
      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);
      for (var col = _moduleCount - 1; col > 0; col -= 2) {
        if (col == 6) col -= 1;
        while (true) {
          for (var c = 0; c < 2; c += 1) {
            if (_modules[row][col - c] == null) {
              var dark = false;
              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }
              var mask = maskFunc(row, col - c);
              if (mask) {
                dark = !dark;
              }
              _modules[row][col - c] = dark;
              bitIndex -= 1;
              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }
          row += inc;
          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };
    var createBytes = function(buffer, rsBlocks) {
      var offset = 0;
      var maxDcCount = 0;
      var maxEcCount = 0;
      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);
      for (var r = 0; r < rsBlocks.length; r += 1) {
        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;
        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);
        dcdata[r] = new Array(dcCount);
        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;
        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);
        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }
      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }
      var data = new Array(totalCodeCount);
      var index = 0;
      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }
      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }
      return data;
    };
    var createData = function(typeNumber, errorCorrectionLevel, dataList) {
      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
      var buffer = qrBitBuffer();
      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }
      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }
      while (true) {
        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);
        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }
      return createBytes(buffer, rsBlocks);
    };
    _this.addData = function(data, mode) {
      mode = mode || 'Byte';
      var newData = null;
      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }
      _dataList.push(newData);
      _dataCache = null;
    };
    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };
    _this.getModuleCount = function() {
      return _moduleCount;
    };
    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;
        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();
          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }
          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {

 ${S.push?`<div class="push" data-a="openpush">${crest()}<div class="x"><div class="tt"><span>${esc(SCHOOL.name)}</span><span>دلوقتي</span></div><b>${esc(S.push.t)}</b>${esc(S.push.b)}</div></div>`:''}
 ${S.done?`<div class="done"><div class="ck">${I('check')}</div><div class="sec num">${S.done.secs}<small style="font-size:17px"> ث</small></div><b>اتسجلت</b><p>وصلت لأولياء أمور ${S.done.n} فصول في شاشة «اليوم»</p>${confetti()}</div>`:''}
 ${S.sheet?sheet():''}${S.wipe?`<div class="wipe" style="--wc:${S.wipe==='principal'?'#1D1D1F':ROLE[S.wipe].c}">${'<span class="ic">'+I(ROLE[S.wipe].i)+'</span>'}<small>دلوقتي إنت</small><b>${ROLE[S.wipe].n}</b></div>`:''}${S.toast?`<div class="toast">${I('check')}${esc(S.toast)}</div>`:''}`;
 const s2=dev.querySelector('.scroll');if(s2&&!S.noScrollKeep)s2.scrollTop=scrollMem[S.role+tab]||0;S.noScrollKeep=false;
 if((S.role==='parent'&&tab==='chat'&&S.thread)||(S.role==='teacher'&&tab==='inbox'&&S.tThread)){const c=dev.querySelector('.scroll');c.scrollTop=c.scrollHeight}
 placeHint();
}
function confetti(){const C=['#E8764A','#2F6B58','#F2B705','#3B4FA8','#8FD3B6'];let h='';for(let k=0;k<26;k++){const a=Math.random()*Math.PI*2,d=90+Math.random()*120;h+=`<i class="conf" style="background:${C[k%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-40}px;--r:${Math.random()*540}deg;animation-delay:${Math.random()*.15}s"></i>`}return h}
function sheet(){const k=S.sheet;
 if(k==='roles')return `<div class="sheet-bg" data-a="closesheet"><div class="sheet" data-stop="1"><div class="grab"></div><h2>شوف التطبيق كـ</h2><p class="lead">نفس المدرسة ونفس اللحظة، من 3 عيون. أي حاجة تعملها في دور بتوصل للتاني.</p>
 ${Object.entries(ROLE).map(([r,R])=>`<button class="rl ${S.role===r?'on':''}" data-a="role:${r}"><span class="ic" style="background:${r==='principal'?'#55534D':R.c}">${I(R.i,'width:21px;height:21px')}</span><span><b>${R.n}</b><small>${R.who}</small></span><span class="ck2">${S.role===r?I('check'):I('arrowl')}</span></button>`).join('')}
 <div style="margin:14px 0 8px;font-size:13px;font-weight:800">جرّب السلسلة</div>${[['log','سجّل حصة كمدرس'],['saw','شوفها عند ولي الأمر'],['alert','ابعت تنبيه كمدير']].map((q,n)=>`<div class="mr">${S.q[q[0]]?I('check','color:var(--ok)'):`<span style="width:20px;height:20px;border-radius:50%;border:1.6px solid var(--line2);display:grid;place-items:center;font-size:10px">${n+1}</span>`}${q[1]}</div>`).join('')}
 <button class="btn hot" style="margin-top:12px" data-a="book">${I('cal')} احجز اجتماع</button></div></div>`;
 if(k==='book')return `<div class="sheet-bg" data-a="closesheet"><div class="sheet" data-stop="1"><div class="grab"></div><h2>احجز اجتماع 30 دقيقة</h2><p class="lead">نوريك المنصة كاملة باسم مدرستك، ونسمع منك. من غير أي التزام.</p>
 <div class="field" style="margin-bottom:10px"><label for="bkName">اسمك</label><input id="bkName" placeholder="الاسم"></div>
 <div class="field" style="margin-bottom:10px"><label for="bkSchool">المدرسة</label><input id="bkSchool" placeholder="اسم المدرسة"></div>
 <div class="field" style="margin-bottom:10px"><label>إنت</label><div class="slots">${['صاحب مدرسة','مدير','مدرس','ولي أمر'].map(r=>`<button class="${S.book.role===r?'on':''}" data-a="bkrole:${r}">${r}</button>`).join('')}</div></div>
 <div class="field" style="margin-bottom:14px"><label>الوقت المناسب</label><div class="slots">${['الصبح','بعد الضهر','بالليل'].map(r=>`<button class="${S.book.slot===r?'on':''}" data-a="bkslot:${r}">${r}</button>`).join('')}</div></div>
 <button class="btn" style="background:#1FA855" data-a="sendbook">${I('wa')} ابعت الطلب على واتساب</button><p class="muted" style="font-size:11.5px;text-align:center;margin:8px 0 0">بيفتح واتساب برسالة جاهزة، وإنت اللي بتدوس إرسال</p></div></div>`;
 if(k==='booked')return `<div class="sheet-bg" data-a="closesheet"><div class="sheet" data-stop="1" style="text-align:center"><div class="grab"></div><div style="width:70px;height:70px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 10px;animation:pop .5s var(--ease)">${I('check','width:34px;height:34px;stroke-width:2.6')}</div><h2>الرسالة جاهزة</h2><p class="lead">${CONTACT_WA?'واتساب اتفتح برسالتك. ابعتها وهنرد عليك في نفس اليوم.':'رقم الواتساب هيتضاف قريب. ده اللي هيتبعت:'}</p><div class="card" style="margin:0 0 12px;text-align:right;font-size:13px;white-space:pre-line">${esc(S.bookText||'')}</div><button class="btn ghost" data-a="closesheet">تمام</button></div></div>`;
 if(k==='bcast')return `<div class="sheet-bg" data-a="closesheet"><div class="sheet" data-stop="1"><div class="grab"></div><h2>رسالة لفصل كامل</h2><p class="lead">بتوصل لكل ولي أمر في محادثته، ومحدش بيشوف رد التاني. مش جروب.</p><div class="slots" style="margin-bottom:12px"><button class="on">4/2 · 24</button><button>4/1 · 26</button><button>4/3 · 25</button></div><div class="field" style="margin-bottom:12px"><textarea>بكره هنراجع المبتدأ والخبر قبل كويز الخميس، ياريت الطلاب يجيبوا كراسة النحو.</textarea></div><button class="btn brand" data-a="sendbcast">${I('send')} ابعت لـ 24 ولي أمر</button></div></div>`;
 if(k==='complaint')return `<div class="sheet-bg" data-a="closesheet"><div class="sheet" data-stop="1"><div class="grab"></div><h2>شكوى للإدارة</h2><p class="lead">بتروح للمدير مباشرة، وحالتها بتبان هنا: جديدة، بتتابَع، اتقفلت.</p><div class="field" style="margin-bottom:12px"><input value="الأتوبيس بيتأخر ربع ساعة الصبح"></div><button class="btn" data-a="sendcomplaint">${I('send')} ابعت</button></div></div>`;
 return '';
}

/* ================= hints (first time per role) ================= */
const HINTS={
 parent:{sel:'#ls1',txt:'دي حصة <b>لسه ماتسجلتش</b>. بدّل لدور المدرس وسجّلها، وارجع شوفها هنا.',btn:'بدّل للمدرس',a:'role:teacher'},
 teacher:{sel:'#logbtn',txt:'بعد الحصة، دوس هنا. <b>البنود جاهزة من الخطة</b>، علّم وابعت.',btn:'تمام'},
 principal:{sel:'#teachcard .btn.hot',txt:'المدير شايف <b>مين سجّل ومين اتأخر</b>، ويذكّره بزرار.',btn:'تمام'}
};
let hintTry=0;function placeHint(){const o=document.querySelector('.hint');o&&o.remove();return;
 const old=document.querySelector('.hint');old&&old.remove();document.querySelectorAll('.glow').forEach(e=>e.classList.remove('glow'));
 if(S.ob||S.sheet||S.done||S.log)return;const h=HINTS[S.role];if(!h||S.seenHint[S.role]||S.tab[S.role]!=='today')return;
 if(S.role==='parent'&&(S.kid!==0||S.logs[1]))return;
 if(S.role==='teacher'&&!document.querySelector('#logbtn'))return;
 const el=document.querySelector(h.sel);if(!el)return;const dev=document.getElementById('device'),sc=dev.querySelector('.scroll');
 const r=el.getBoundingClientRect(),d=dev.getBoundingClientRect();
 if(r.bottom>d.bottom-140&&hintTry<3){hintTry++;sc.scrollTop+=r.bottom-(d.bottom-260);return setTimeout(placeHint,60)}hintTry=0;
 el.classList.add('glow');const box=document.createElement('div');box.className='hint below';box.innerHTML=`${h.txt}<div class="hb">${h.a?`<button data-a="${h.a}">${h.btn}</button><button class="g" data-a="hintok">بعدين</button>`:`<button data-a="hintok">${h.btn}</button>`}</div>`;
 const r2=el.getBoundingClientRect();box.style.right='18px';box.style.visibility='hidden';dev.appendChild(box);const bh=box.offsetHeight;
 if(r2.bottom-d.top+10+bh>d.height-96){box.className='hint above';box.style.top=(r2.top-d.top-bh-10)+'px'}else box.style.top=(r2.bottom-d.top+10)+'px';box.style.visibility='';
}

/* ================= actions ================= */
let pushT,toastT;
function push(t,b,ms=4200){S.push={t,b};vib([50,40,50]);clearTimeout(pushT);pushT=setTimeout(()=>{S.push=null;render()},ms)}
function toast(t){S.toast=t;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},2600)}
function setRole(r){if(r!==S.role){S.wipe=r;clearTimeout(setRole.t);setRole.t=setTimeout(()=>{S.wipe=null;render()},1000)}S.role=r;S.sheet=null;S.log=null;S.thread=S.thread||null;const q=S.pending[r];if(q.length){const n=q.shift();setTimeout(()=>{push(n[0],n[1]);if(n[2])S.flash=n[2];render();setTimeout(()=>{S.flash=null;render()},2200)},1150)}
 if(r==='parent'&&S.logs[1]&&!S.q.saw){S.q.saw=true;S.tab.parent='today';S.kid=0;setTimeout(()=>{const el=document.getElementById('ls1');el&&el.scrollIntoView({block:'center',behavior:'smooth'})},500);maybeCTA()}}
function maybeCTA(){if(questN()>=2&&!S.ctaShown){S.ctaShown=true;setTimeout(()=>{S.sheet='roles';render()},3200)}}
function sendLog(){const L=S.log;if(!L.picks.length)L.picks=[1];const secs=Math.max(4,Math.min(14,L.start?Math.round((Date.now()-L.start)/1000):8));
 const ps=[L.p].concat(L.copy);ps.forEach(p=>S.tlog[p]=true);
 if(ps.includes(1)){const hwEl=document.getElementById('hwtx');S.logs[1]={items:L.picks.slice().sort(),hw:L.hw?((hwEl&&hwEl.value)||'كراسة النحو · صفحة 10'):null};S.pending.parent.push(['الحصة اتسجلت','اللغة العربية: '+SUB.ar.items[S.logs[1].items[0]]+(S.logs[1].hw?' · وفيه واجب':''),'p1'])}
 S.pending.principal.push(['المدرسين بيسجلوا','أ. سامية سجّلت '+ps.length+' حصص دلوقتي','node2']);
 S.q.log=true;S.done={secs,n:ps.length};S.log=null;vib([30,30,80]);S.seenHint.teacher=true;render();clearTimeout(sendLog.t);sendLog.t=setTimeout(()=>{S.done=null;S.flashT=1;render();setTimeout(()=>{S.flashT=0;render()},1600)},2300);}

function tSend(tx,img){const th=TTH.find(x=>x.id===S.tThread);if(!th)return;vib(15);
 if(th.id==='yousef'){S.chat.push({me:false,t:tx,m:'دلوقتي',img});S.pending.parent.push(['رد من أ. سامية',tx.slice(0,60)])}
 else th.msgs.push({them:0,t:tx,m:'دلوقتي',img,seen:0});
 render();
 setTimeout(()=>{const M=th.id==='yousef'?null:th.msgs;if(M){M[M.length-1].seen=1}render();
  if(th.reply&&!th.replied){th.replied=1;S.tTyping=true;render();setTimeout(()=>{S.tTyping=false;th.msgs.push({them:1,t:th.reply,m:'دلوقتي'});vib(20);render()},2000)}},1100)}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a],[data-tab],[data-kid]');if(!t)return;
 if(t.dataset.tab){S.navAnim=true;const ord=['today','plan','chat','fees','inbox','more','alert'];S.dir=ord.indexOf(t.dataset.tab)>ord.indexOf(S.tab[S.role])?'slideL':'slideR';S.tab[S.role]=t.dataset.tab;S.log=null;if(t.dataset.tab!=='chat')S.thread=null;if(t.dataset.tab!=='inbox')S.tThread=null;render();return}
 if(t.dataset.kid){S.kid=+t.dataset.kid;render();return}
 const a=t.dataset.a,[k,v]=a.split(':');
 if(k==='closesheet'){if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a="closesheet"]')&&t.classList.contains('sheet-bg'))return;S.sheet=null;render();return}
 switch(k){
  case 'ob':S.obi=+v;render();break;
  case 'start':S.ob=false;S.role=v;S.navAnim=true;render();break;
  case 'roles':S.sheet='roles';render();break;
  case 'role':setRole(v);S.navAnim=true;render();break;
  case 'hintok':S.seenHint[S.role]=true;render();break;
  case 'log':S.log={p:+v,picks:[],hw:false,copy:TEACH.filter(x=>!x.cover&&x.p!==+v&&!S.tlog[x.p]).map(x=>x.p),start:null};S.seenHint.teacher=true;S.noScrollKeep=true;render();break;
  case 'pick':{const L=S.log,i=+v;if(!L.start)L.start=Date.now();L.picks.includes(i)?L.picks.splice(L.picks.indexOf(i),1):L.picks.push(i);vib(8);render();break}
  case 'hw':if(!S.log.start)S.log.start=Date.now();S.log.hw=!S.log.hw;render();break;
  case 'copy':{const L=S.log,p=+v;L.copy.includes(p)?L.copy.splice(L.copy.indexOf(p),1):L.copy.push(p);render();break}
  case 'closelog':S.log=null;render();break;
  case 'sendlog':sendLog();break;
  case 'seeparent':S.done=null;setRole('parent');render();break;
  case 'trip':S.trip=v||null;vib(20);toast(v==='yes'?'ردك وصل · المدرسة شايفة العدد دلوقتي':'ردك وصل');render();break;
  case 'thread':S.thread=v||null;render();break;
  case 'sendmsg':{const el=document.getElementById('msg');const tx=(el&&el.value.trim())||'شكرًا يا أستاذة، هنراجعها معاه النهاردة';S.chat.push({me:true,t:tx,m:'دلوقتي · اتبعتت'});S.inbox.push(tx);S.typing=true;render();setTimeout(()=>{S.typing=false;S.chat[S.chat.length-1].m='دلوقتي · اتقرت';S.chat.push({me:false,t:'تمام، وأنا هتابعه معاه بكره في الحصة.',m:'دلوقتي'});vib(30);render()},2200);break}

  case 'tth':S.tThread=v||null;S.noScrollKeep=!v;render();break;
  case 'topen':S.tab.teacher='inbox';S.tThread=v;render();break;
  case 'tq':{const el=document.getElementById('tmsg');if(el){el.value=QUICK[+v];el.focus()}break}
  case 'tattach':tSend('بعتلك ورقة تدريب على الدرس، يحلها النهاردة لو ينفع',true);break;
  case 'tsend':{const el=document.getElementById('tmsg');const tx=(el&&el.value.trim())||QUICK[0];tSend(tx);break}
  case 'bcast':S.sheet='bcast';render();break;
  case 'sendbcast':S.sheet=null;vib(30);toast('اتبعتت لـ 24 ولي أمر في 4/2 · اتقرت 9 لحد دلوقتي');render();break;
  case 'complaint':S.sheet='complaint';render();break;
  case 'sendcomplaint':S.sheet=null;toast('الشكوى وصلت للمدير · حالتها: جديدة');render();break;
  case 'pay':S.payPick=v;render();break;
  case 'dopay':S.paid=true;vib([30,30,80]);toast('الإيصال اتبعت لوحده');render();break;
  case 'remind':S.reminded[v]=true;vib(15);toast('التذكير وصل على موبايل '+v);render();break;
  case 'aud':S.alert.aud=v;render();break;
  case 'urg':S.alert.urgent=!S.alert.urgent;render();break;
  case 'sendalert':{const el=document.getElementById('alerttx');if(el)S.alert.text=el.value;const tot={parents:1042,teachers:38,grade:96}[S.alert.aud];S.alert.total=tot;S.alert.sent=true;S.alert.read=0;S.q.alert=true;if(S.alert.aud!=='teachers')S.pending.parent.push(['تنبيه من المدير'+(S.alert.urgent?' · عاجل':''),S.alert.text]);vib(40);render();[.22,.47,.68,.81].forEach((f,n)=>setTimeout(()=>{S.alert.read=Math.round(tot*f);render()},650*(n+1)));maybeCTA();break}
  case 'book':S.sheet='book';render();break;
  case 'bkrole':S.book.role=v;render();break;
  case 'bkslot':S.book.slot=v;render();break;
  case 'sendbook':{const n=(document.getElementById('bkName')||{}).value||'',sc=(document.getElementById('bkSchool')||{}).value||'';S.bookText=`السلام عليكم، جربت تطبيق «أسبوع الطالب» وحابب أحجز اجتماع.\nالاسم: ${n||'—'}\nالمدرسة: ${sc||'—'}\nأنا: ${S.book.role}\nالوقت المناسب: ${S.book.slot}`;if(CONTACT_WA){window.open('https://wa.me/'+CONTACT_WA+'?text='+encodeURIComponent(S.bookText),'_blank')}S.sheet='booked';render();break}
  case 'openpush':S.push=null;render();break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msg'){document.querySelector('[data-a="sendmsg"]').click()}if(e.key==='Enter'&&e.target.id==='tmsg'){document.querySelector('[data-a="tsend"]').click()}});

setInterval(()=>{const el=document.getElementById('tmr');if(el&&S.log&&S.log.start)el.textContent=Math.round((Date.now()-S.log.start)/1000)},300);
let waT=[];function playWA(){waT.forEach(clearTimeout);waT=[];const M=[['أم مالك','حد يعرف الواجب إيه؟؟','#C2185B'],['أم جنى','الميس قالت صفحة كام؟','#1565C0'],['أبو عمر','هو فيه امتحان بكره؟','#2E7D32'],['أم سلمى','ابني بيقول مفيش واجب 😅','#6A1B9A'],['أم يوسف','حد صوّر الكراسة؟','#EF6C00'],['أبو آدم','يا جماعة الكويز إمتى؟','#00838F']];let n=12;
 M.forEach((m,i)=>waT.push(setTimeout(()=>{const box=document.getElementById('wams'),u=document.getElementById('unread');if(!box||S.obi!==0)return;box.insertAdjacentHTML('beforeend',`<div class="m"><i style="color:${m[2]}">${m[0]}</i>${m[1]}</div>`);n+=i===M.length-1?147-n:19;u.textContent=n},500+i*650)))}

 p.innerHTML=`<span class="mk">HM</span><h1>أسبوع ابنك الدراسي في جيبك</h1><p>تطبيق للمدرسة بيربط المشرف والمدرس وولي الأمر والمدير. جرّبه من الموبايل اللي جنبك، أو على موبايلك الحقيقي.</p>${svg?`<div class="qr">${svg}<div><b>افتحه على موبايلك</b><small>صوّر الكود بالكاميرا</small></div></div>`:''}<p style="font-size:12px;color:var(--muted)">بيانات تجريبية بالكامل · الأسامي للعرض بس</p>`})();
